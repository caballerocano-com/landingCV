<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firmar contrato · Caballero Cano</title>
  <link rel="stylesheet" href="/app/css/reset.css">
  <link rel="stylesheet" href="/app/css/vars.css">
  <link rel="stylesheet" href="/app/css/app.css">
  <style>
    body { background: var(--bg-alt); }
    .firmar-shell { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
    .firmar-header { text-align: center; margin-bottom: 20px; }
    .firmar-header h1 { font-family: var(--heading); font-size: 18px; color: var(--text); margin-top: 8px; }
    #signature-canvas {
      width: 100%;
      max-width: 600px;
      height: 220px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: var(--white);
      touch-action: none;
      display: block;
    }
    .terms-box {
      max-height: 200px;
      overflow-y: auto;
      background: var(--bg-alt);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: var(--text-mid);
      white-space: pre-wrap;
    }
    .confirm-screen { text-align: center; padding: 48px 16px; }
  </style>
</head>
<body>
  <div class="firmar-shell">
    <div class="firmar-header">
      <div style="font-family:var(--heading); font-weight:700; font-size:16px;">Caballero Cano</div>
      <h1>Firma del contrato de servicios</h1>
    </div>

    <div id="loading" class="spinner-text" style="text-align:center;">Cargando contrato…</div>
    <div id="message-screen" class="confirm-screen" hidden></div>

    <div id="contract-root" hidden>
      <div class="section" id="contract-info"></div>
      <div class="section">
        <h2>Conceptos</h2>
        <div id="contract-conceptos"></div>
        <div class="totals-row" id="contract-totals"></div>
      </div>
      <div class="section" id="contract-payment"></div>
      <div class="section" id="contract-terms" hidden>
        <h2>Términos y condiciones</h2>
        <div class="terms-box" id="terms-text"></div>
      </div>

      <div class="section">
        <h2>Firma</h2>
        <p class="text-muted mt-8" style="margin-bottom:10px;">Firme en el recuadro con el dedo o el ratón.</p>
        <canvas id="signature-canvas"></canvas>
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button type="button" class="btn btn-secondary" id="clear-signature">Limpiar</button>
          <button type="button" class="btn btn-primary" id="submit-signature" disabled>Firmar y confirmar</button>
        </div>
        <p class="error-text" id="sign-error" hidden></p>
      </div>
    </div>
  </div>

  <script type="module" src="/app/js/firmar.js"></script>
</body>
</html>
