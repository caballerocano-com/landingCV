<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caballero Cano · Gestión</title>
  <link rel="stylesheet" href="/app/css/reset.css">
  <link rel="stylesheet" href="/app/css/vars.css">
  <link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-card__logo">Caballero Cano</div>
      <div class="login-card__sub">Gestión de proyectos y clientes</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="error-text" id="login-error" hidden></p>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 8px;">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="/app/js/login.js"></script>
</body>
</html>
