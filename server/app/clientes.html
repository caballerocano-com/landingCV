<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes · Caballero Cano</title>
  <link rel="stylesheet" href="/app/css/reset.css">
  <link rel="stylesheet" href="/app/css/vars.css">
  <link rel="stylesheet" href="/app/css/app.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
</head>
<body>
  <div id="topbar-root"></div>

  <main>
    <div class="page-header">
      <h1>Clientes</h1>
      <button class="btn btn-primary" id="new-client-btn">+ Nuevo cliente</button>
    </div>

    <div class="section" id="new-client-section" hidden>
      <h2>Nuevo cliente</h2>
      <form id="new-client-form">
        <div class="grid grid-2">
          <div class="field">
            <label for="nc-nombre">Nombre</label>
            <input type="text" id="nc-nombre" required>
          </div>
          <div class="field">
            <label for="nc-nif">NIF</label>
            <input type="text" id="nc-nif">
          </div>
          <div class="field">
            <label for="nc-telefono">Teléfono</label>
            <input type="text" id="nc-telefono">
          </div>
          <div class="field">
            <label for="nc-email">Email</label>
            <input type="email" id="nc-email">
          </div>
        </div>
        <div class="field">
          <label for="nc-direccion">Dirección fiscal</label>
          <input type="text" id="nc-direccion">
        </div>
        <div class="field">
          <label for="nc-notas">Notas</label>
          <textarea id="nc-notas"></textarea>
        </div>
        <p class="error-text" id="new-client-error" hidden></p>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary">Crear cliente</button>
          <button type="button" class="btn btn-secondary" id="cancel-new-client">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="section">
      <div class="field" style="max-width:320px;">
        <label for="search">Buscar</label>
        <input type="text" id="search" placeholder="Nombre, NIF, email...">
      </div>
    </div>

    <div id="clients-list"></div>
  </main>

  <script type="module" src="/app/js/clientes.js"></script>
</body>
</html>
